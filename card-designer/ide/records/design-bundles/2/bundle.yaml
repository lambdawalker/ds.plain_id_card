name: Horizontal identity · detailed
layouts:
- name: Portrait left
  template: |
    <div class="card">
      <header class="card-header">
        <div class="title-section">
          <h1>{{ common.get('card_title') or identity.document_type or 'IDENTITY CARD' }}</h1>
          <h2>{{ common.get('issuer') or identity.issuing_authority or 'SPECIMEN' }}</h2>
        </div>
      </header>
      <main class="identity-body">
        <div class="photo-section">
          <img
            class="main-photo"
            src="{{ assets.photo }}"
            data-class="photo"
            alt="Portrait"
          />
        </div>
        <div class="identity-details field-grid">
          <div class="card-field field-name field-full">
            <span class="field-label">NAME</span>
            <p>{{ identity.full_name or '—' }}</p>
          </div>
          <div class="card-field">
            <span class="field-label">DATE OF BIRTH</span>
            <p>{{ identity.birth_date or '—' }}</p>
          </div>
          <div class="card-field">
            <span class="field-label">SEX</span>
            <p>{{ identity.sex or '—' }}</p>
          </div>
          <div class="card-field field-address field-full">
            <span class="field-label">ADDRESS</span>
            <p>{{ identity.address_line1 or '—' }}</p>
            {% if identity.address_line2 %}
            <p>{{ identity.address_line2 }}</p>
            {% endif %}
          </div>
          <div class="card-field">
            <span class="field-label">DOCUMENT NUMBER</span>
            <p>{{ identity.document_number or '—' }}</p>
          </div>
          <div class="card-field">
            <span class="field-label">NATIONALITY</span>
            <p>{{ identity.nationality or '—' }}</p>
          </div>
          <div class="physical-grid field-full">
            <div class="card-field">
              <span class="field-label">HEIGHT</span>
              <p>{{ identity.height or '—' }}</p>
            </div>
            <div class="card-field">
              <span class="field-label">EYES</span>
              <p>{{ identity.eye_color or '—' }}</p>
            </div>
            <div class="card-field">
              <span class="field-label">BLOOD TYPE</span>
              <p>{{ identity.blood_type or '—' }}</p>
            </div>
          </div>
          <div class="field-pair validity-dates field-full">
            <div class="card-field field-issued">
              <span class="field-label">ISSUED</span>
              <p>{{ identity.issue_date or '—' }}</p>
            </div>
            <div class="card-field field-expires">
              <span class="field-label">EXPIRES</span>
              <p>{{ identity.expiry_date or '—' }}</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  css: |
    /* Card-scale typography and common aligned field primitives. */
    html, body {
      margin: 0;
      padding: 0;
      font: 28px/1.2 Arial, sans-serif;
      color: {{ env.theme.text_color.to_rgb_hex() }};
    }
    * { box-sizing: border-box; }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: {{ variation.margin }}px;
      overflow: hidden;
      font-size: {{ variation.font_size }}px;
      display: flex;
      flex-direction: column;
      gap: {{ variation.header_gap }}px;
    }
    h1, h2, p { margin: 0; }
    .card-header {
      flex-shrink: 0;
      margin: 0;
      padding-bottom: 14px;
    }
    .title-section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
      align-items: start;
      gap: 28px;
    }
    .title-section h1 {
      font-size: {{ 1 if (common.get('card_title') or identity.document_type or '')|length > 26 else 1.3 }}em;
      line-height: 1.1;
    }
    .title-section h2 {
      font-size: {{ 0.85 if (common.get('issuer') or identity.issuing_authority or '')|length > 42 else 1 }}em;
      line-height: 1.15;
      text-align: right;
    }
    .title-section > *, .card-field, .identity-details {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .photo-section {
      position: relative;
      min-height: 0;
    }
    .main-photo {
      display: block;
      object-fit: cover;
      background: {{ variation.photo_background|default('transparent') }};
    }
    .card-field { margin: 0; }
    .card-field p {
      margin-top: 4px;
      line-height: 1.18;
    }
    .field-label {
      display: block;
      font-size: {{ variation.label_size }}px;
      letter-spacing: .045em;
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .field-name p {
      font-size: {{ 1.05 if identity.full_name|length > 36 else 1.2 }}em;
      font-weight: 700;
    }
    .field-value-emphasis {
      font-size: 1.08em;
      font-weight: 700;
      letter-spacing: .025em;
    }
    .field-value-compact { font-size: .95em; }
    .field-grid, .field-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: {{ variation.field_gap }}px 28px;
      align-content: start;
    }
    .field-full { grid-column: 1 / -1; }
    .physical-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .validity-dates > .field-issued { order: {{ variation.dates_reversed }}; }
    .validity-dates > .field-expires { order: {{ 1 - variation.dates_reversed }}; }
    .code-image {
      display: block;
      object-fit: contain;
      max-width: 100%;
    }

    .field-address p { font-size: .94em; }
    .card > .validity-dates { flex-shrink: 0; }
    .code-panel { flex-shrink: 0; }


    /* Shared side-by-side portrait layout. Variants supply the column order. */
    .identity-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--portrait-columns);
      gap: {{ variation.column_gap }}px;
    }
    .identity-body > .photo-section {
      grid-column: var(--portrait-column);
      grid-row: 1;
    }
    .identity-body > .identity-details {
      grid-column: var(--data-column);
      grid-row: 1;
    }
    .identity-body .main-photo {
      width: 100%;
      height: var(--portrait-height, 100%);
    }

    .identity-details { align-content: space-between; }

    .card { --portrait-columns: 340px minmax(0, 1fr); --portrait-column: 1; --data-column: 2; }
  seed: 42
  color: '#a4d5c8'
  background: type-b
  background_recipe: null
  sample: ''
  width: 1350
  height: 850
  auto_theme: true
  text_color: '#000000'
  layout_id: stock-B-left
  template_id: B-left
  bundle_id: horizontal-details
  variation_version: 2
  template_parameters: null
  common: {}
