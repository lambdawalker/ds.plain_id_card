name: Georgia A
layouts:
- name: Georgia A · Front
  template: |
    <article class="card georgia-front">
      <header class="georgia-heading">
        <div><h1>GEORGIA A</h1><p>DRIVING CARD · DATASET SAMPLE</p></div>
        <strong class="specimen-mark">SPECIMEN</strong>
      </header>
      <main class="georgia-front-body">
        <div class="georgia-portrait">
          <img class="main-photo" src="{{ assets.photo }}" data-class="photo" alt="Sample portrait">
          <span>FICTIONAL RECORD</span>
        </div>
        <div class="georgia-fields">
          <div class="card-field"><span class="field-label">DOCUMENT NO.</span><strong>{{ identity.document_number or '—' }}</strong></div>
          <div class="card-field"><span class="field-label">DATE OF BIRTH</span><strong>{{ identity.birth_date or '—' }}</strong></div>
          <div class="card-field"><span class="field-label">CLASS</span><strong>{{ common.get('vehicle_class') or 'C' }}</strong></div>
          <div class="card-field"><span class="field-label">EXPIRES</span><strong>{{ identity.expiry_date or '—' }}</strong></div>
          <div class="card-field field-full georgia-name"><span class="field-label">NAME</span><strong>{{ identity.full_name or '—' }}</strong></div>
          <div class="card-field field-full"><span class="field-label">ADDRESS</span><strong>{{ identity.address_line1 or '—' }}{% if identity.address_line2 %}<br>{{ identity.address_line2 }}{% endif %}</strong></div>
          <div class="card-field"><span class="field-label">ISSUED</span><strong>{{ identity.issue_date or '—' }}</strong></div>
          <div class="card-field"><span class="field-label">RESTRICTIONS</span><strong>{{ common.get('restrictions') or 'NONE' }}</strong></div>
          <div class="georgia-traits field-full">
            <div class="card-field"><span class="field-label">SEX</span><strong>{{ identity.sex or '—' }}</strong></div>
            <div class="card-field"><span class="field-label">EYES</span><strong>{{ identity.eye_color or '—' }}</strong></div>
            <div class="card-field"><span class="field-label">HEIGHT</span><strong>{{ identity.height or '—' }}</strong></div>
            <div class="card-field"><span class="field-label">WEIGHT</span><strong>{{ identity.weight or '—' }}</strong></div>
          </div>
        </div>
      </main>
      <div class="georgia-peach" aria-hidden="true"></div>
    </article>
  css: |
    /* Card-scale typography and common aligned field primitives. */
    html, body {
      margin: 0;
      padding: 0;
      font: 28px/1.2 Arial, sans-serif;
      color: {{ env.theme.text_color.to_rgb_hex() }};
    }
    * { box-sizing: border-box; }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: {{ variation.margin }}px;
      overflow: hidden;
      font-size: {{ variation.font_size }}px;
      display: flex;
      flex-direction: column;
      gap: {{ variation.header_gap }}px;
    }
    h1, h2, p { margin: 0; }
    .card-header {
      flex-shrink: 0;
      margin: 0;
      padding-bottom: 14px;
    }
    .title-section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
      align-items: start;
      gap: 28px;
    }
    .title-section h1 {
      font-size: {{ 1 if (common.get('card_title') or identity.document_type or '')|length > 26 else 1.3 }}em;
      line-height: 1.1;
    }
    .title-section h2 {
      font-size: {{ 0.85 if (common.get('issuer') or identity.issuing_authority or '')|length > 42 else 1 }}em;
      line-height: 1.15;
      text-align: right;
    }
    .title-section > *, .card-field, .identity-details {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .photo-section {
      position: relative;
      min-height: 0;
    }
    .main-photo {
      display: block;
      object-fit: cover;
      background: {{ variation.photo_background|default('transparent') }};
    }
    .card-field { margin: 0; }
    .card-field p {
      margin-top: 4px;
      line-height: 1.18;
    }
    .field-label {
      display: block;
      font-size: {{ variation.label_size }}px;
      letter-spacing: .045em;
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .field-name p {
      font-size: {{ 1.05 if identity.full_name|length > 36 else 1.2 }}em;
      font-weight: 700;
    }
    .field-value-emphasis {
      font-size: 1.08em;
      font-weight: 700;
      letter-spacing: .025em;
    }
    .field-value-compact { font-size: .95em; }
    .field-grid, .field-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: {{ variation.field_gap }}px 28px;
      align-content: start;
    }
    .field-full { grid-column: 1 / -1; }
    .physical-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .validity-dates > .field-issued { order: {{ variation.dates_reversed }}; }
    .validity-dates > .field-expires { order: {{ 1 - variation.dates_reversed }}; }
    .code-image {
      display: block;
      object-fit: contain;
      max-width: 100%;
    }

    .field-address p { font-size: .94em; }
    .card > .validity-dates { flex-shrink: 0; }
    .code-panel { flex-shrink: 0; }


    /* Shared side-by-side portrait layout. Variants supply the column order. */
    .identity-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--portrait-columns);
      gap: {{ variation.column_gap }}px;
    }
    .identity-body > .photo-section {
      grid-column: var(--portrait-column);
      grid-row: 1;
    }
    .identity-body > .identity-details {
      grid-column: var(--data-column);
      grid-row: 1;
    }
    .identity-body .main-photo {
      width: 100%;
      height: var(--portrait-height, 100%);
    }

    .georgia-front {
      color: #172f33;
      background:
        repeating-radial-gradient(ellipse at 75% -36%, #366e6618 0 2px, transparent 3px 8px),
        linear-gradient(115deg, #a6d0c1, #f7edcc 55%, #b3d4c2);
    }
    .georgia-heading {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 24px;
      z-index: 1;
    }
    .georgia-heading h1 { font-size: 65px; letter-spacing: .07em; line-height: 1; }
    .georgia-heading p { margin-top: 8px; font-weight: 700; color: #8a4032; font-size: 21px; letter-spacing: .08em; }
    .specimen-mark { padding: 8px 15px; border: 2px solid currentColor; border-radius: 5px; color: #8a4032; letter-spacing: .1em; font-size: 23px; }
    .georgia-front-body {
      display: grid;
      grid-template-columns: 28% minmax(0, 1fr);
      gap: 28px;
      flex: 1;
      min-height: 0;
      z-index: 1;
    }
    .georgia-portrait { display: flex; flex-direction: column; min-height: 0; gap: 10px; }
    .georgia-portrait .main-photo { width: 100%; flex: 1; min-height: 0; border-radius: 10px; }
    .georgia-portrait span { font-size: 16px; font-weight: 700; letter-spacing: .1em; }
    .georgia-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 22px; align-content: space-between; }
    .georgia-fields .field-label { color: #35564f; font-weight: 700; }
    .georgia-name strong { font-size: 1.35em; }
    .georgia-traits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .georgia-peach { position: absolute; right: -50px; bottom: -150px; width: 520px; height: 520px; border-radius: 48%; background: radial-gradient(ellipse at 30% 25%, #f7d396, #d36f5f); opacity: .32; transform: rotate(-18deg); }
    .georgia-peach::before { content: ""; position: absolute; width: 180px; height: 76px; left: 120px; top: -22px; border-radius: 90% 0; background: #498f70; }

    /* Front layout uses the stylesheet in this directory. */
  seed: 42
  color: '#e2eddb'
  background: plain
  background_recipe: null
  sample: ''
  width: 1350
  height: 850
  auto_theme: false
  text_color: '#000000'
  layout_id: stock-GA-front
  template_id: GA-front
  bundle_id: georgia-a
  variation_version: 2
  template_parameters: null
  common: {}
- name: Georgia A · Back
  template: |
    <article class="card georgia-back">
      <aside class="georgia-code-rail">
        <img class="code-image" src="{{ assets.barcode }}" data-class="barcode" alt="Dataset linear barcode">
      </aside>
      <main class="georgia-reverse">
        <header class="georgia-reverse-heading">
          <div><h1>GEORGIA A</h1><p>DRIVING CARD · DATASET SAMPLE</p></div>
          <strong class="specimen-mark">SPECIMEN</strong>
        </header>
        <img class="georgia-stacked-code code-image" src="{{ assets.pdf417 }}" data-class="pdf417" alt="Dataset PDF417 image">
        <div class="georgia-back-fields">
          <div class="card-field field-full"><span class="field-label">MEDICAL INFORMATION</span><strong>{{ common.get('medical_information') or 'NONE' }}</strong></div>
          <div class="card-field"><span class="field-label">CLASS</span><strong>{{ common.get('vehicle_class') or 'C' }}</strong></div>
          <div class="card-field"><span class="field-label">ENDORSEMENTS</span><strong>{{ common.get('endorsements') or 'NONE' }}</strong></div>
          <div class="card-field"><span class="field-label">RESTRICTIONS</span><strong>{{ common.get('restrictions') or 'NONE' }}</strong></div>
          <div class="card-field"><span class="field-label">DATE OF BIRTH</span><strong>{{ identity.birth_date or '—' }}</strong></div>
        </div>
        <p class="georgia-back-note">FICTIONAL RECORD · NOT VALID FOR IDENTIFICATION</p>
      </main>
    </article>
