<div class="card">
  <header class="card-header">
    <div class="title-section"><h1>IDENTITY CARD</h1><h2>SPECIMEN</h2></div>
  </header>
  <main class="identity-body">
    <div class="photo-section"><div class="main-photo" data-class="photo">PHOTO</div></div>
    <div class="identity-details">
      <div class="primary-fields">
        <div class="card-field"><span class="field-label">NAME</span><p>Alex Rivera</p><p>Sample cardholder</p></div>
        <div class="field-pair">
          <div class="card-field"><span class="field-label">DATE OF BIRTH</span><p>1990-01-01</p></div>
          <div class="card-field"><span class="field-label">SEX</span><p>X</p></div>
        </div>
      </div>
      <div class="card-field"><span class="field-label">ADDRESS</span><p>123 Example Street</p><p>Sample District, Block 4</p><p>Example City, Example State</p></div>
      <div class="card-field"><span class="field-label">REGISTRY CODE</span><span>EXAMPLE000000000001</span></div>
      <div class="field-pair">
        <div class="card-field"><span class="field-label">IDENTIFIER</span><span>EXAMPLE000000000002</span></div>
        <div class="card-field"><span class="field-label">ISSUED</span><span>2026</span></div>
      </div>
      <div class="field-pair">
        <div class="card-field"><span class="field-label">SECTION</span><span>01</span></div>
        <div class="card-field"><span class="field-label">DISTRICT</span><span>02</span></div>
      </div>
    </div>
  </main>
</div>
