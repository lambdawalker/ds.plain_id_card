<div class="card">
  <header class="card-header">
    <div class="title-section"><h1>IDENTITY CARD</h1><h2>SPECIMEN</h2></div>
  </header>
  <main class="card-body">
    <div class="photo-section"><div class="main-photo" data-class="photo">PHOTO</div></div>
    <div class="data-section">
      <div class="name-holder">
        <div class="data-item name"><label>NAME</label><p>Alex Rivera</p><p>Sample cardholder</p></div>
        <div class="data-group">
          <div class="data-item date"><label>DATE OF BIRTH</label><p>1990-01-01</p></div>
          <div class="data-item sex"><label>SEX</label><p>X</p></div>
        </div>
      </div>
      <div class="data-item address"><label>ADDRESS</label><p>123 Example Street</p><p>Sample District, Block 4</p><p>Example City, Example State</p></div>
      <div class="data-item key-voter"><div class="key"><label>REGISTRY CODE</label><span>EXAMPLE000000000001</span></div></div>
      <div class="data-item key-curp">
        <div class="curp"><label>IDENTIFIER</label><span>EXAMPLE000000000002</span></div>
        <div class="year"><label>ISSUED</label><span>2026</span></div>
      </div>
      <div class="data-group bottom-row">
        <div class="data-item state"><label>SECTION</label><span>01</span></div>
        <div class="data-item state"><label>DISTRICT</label><span>02</span></div>
      </div>
    </div>
  </main>
</div>
