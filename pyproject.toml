[project]
name = "ds-plain-id"
version = "0.1.0"
description = "Dataset plain ID generation and rendering"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "lambdawalker-draw-tools @ git+https://github.com/lambdawalker/python_lw_drawing_tools.git",
    "pillow>=12.0.0",
    "requests>=2.32.0",
    "rich>=14.0.0",
    "uvicorn>=0.40.0",
]

[tool.ds-plain-id.datasets]
required-paths = [
    "@DS/ds.photo_id",
    "@DS/ds.machine_readable_code",
]
